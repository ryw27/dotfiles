# -------------------- Easy reload --------------------
unbind r
bind r source-file ~/.tmux.conf


# -------------------- Utility --------------------
set-option -sa terminal-overrides ",xterm*:Tc"
set -sg escape-time 10
set -g mouse on

# -------------------- Rebind Leader --------------------
unbind C-b
set -g prefix C-Space

# -------------------- Pane Bindings --------------------
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c '#{pane_current_path}'

# -------------------- Pane Indexing --------------------
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


# -------------------- Status Bar --------------------
set-option -g status-position top
set -g status-right-length 120
set -g status-left-length 0
set -g status-interval 5

# Catppuccin: squared inactive tabs, rounded active tab.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "custom"
# inactive (squared)
set -g @catppuccin_window_left_separator " "
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_right_separator " "
# active (rounded)
set -g @catppuccin_window_current_left_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_window_text " #{pane_current_command} "
set -g @catppuccin_window_current_text " #{pane_current_command} "
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_status_background "default"
set -g status-style "bg=default"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "yes"
set -g @catppuccin_status_fill "icon"

# Right: compact clock + prefix pill (green/red icon, no session name clutter).
set -g @catppuccin_date_time_text " %H:%M"
set -g @catppuccin_session_text ""

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_date_time}#{E:@catppuccin_status_session}"

# -------------Plugins-------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
